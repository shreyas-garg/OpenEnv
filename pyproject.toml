[project]
name = "policy-drift"
version = "1.0.0"
description = "Policy-Drift OpenEnv — customer-support triage where rules drift mid-episode"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"
